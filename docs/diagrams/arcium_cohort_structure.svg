<svg width="100%" viewBox="0 0 680 470" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Arcium cohort structure</title>
<desc>Five agents arranged in a pentagon graph. Forward flow: Team Lead to Architect to Engineer to Critic to Comms. Critic back-routes via dashed amber arrows: to Engineer on implementation gap, to Architect on design gap. Permitted edges are declared in the COHORT.md manifest. Agents choose their routing via YAML frontmatter in verdict files at runtime.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text { font-family: -apple-system, "system-ui", "Segoe UI", sans-serif; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; font-weight: 400; }
</style>

<text class="th" x="340" y="22" text-anchor="middle" fill="rgb(250,249,245)">Arcium cohort structure</text>
<text class="ts" x="340" y="40" text-anchor="middle" fill="rgb(194,192,182)">poc-generator · manifest declares valid edges · agents choose routing at runtime</text>

<!-- Forward flow edges (teal solid) — drawn before circles so circles clip the ends -->
<!-- Team Lead(340,90) → Architect(197,194) -->
<line x1="301" y1="118" x2="236" y2="166" stroke="rgb(93,202,165)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<!-- Architect(197,194) → Engineer(252,361) -->
<line x1="212" y1="240" x2="237" y2="315" stroke="rgb(93,202,165)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<!-- Engineer(252,361) → Critic(428,361) horizontal -->
<line x1="300" y1="361" x2="380" y2="361" stroke="rgb(93,202,165)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<!-- Critic(428,361) → Comms(483,194) — PASS route -->
<line x1="443" y1="315" x2="468" y2="240" stroke="rgb(93,202,165)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="462" y="260" text-anchor="middle" fill="rgb(93,202,165)">PASS</text>

<!-- Critic back-routes (amber dashed) -->
<!-- Critic → Engineer arc (implementation gap) — curves up through center area -->
<path d="M 428 313 Q 340 200 252 313" fill="none" stroke="rgb(210,145,40)" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<!-- Critic → Architect diagonal (design gap) -->
<line x1="389" y1="333" x2="236" y2="222" stroke="rgb(210,145,40)" stroke-width="1.5" stroke-dasharray="5 3" fill="none" marker-end="url(#arrow)"/>

<!-- Back-route labels anchored near Critic circle (outside, in clear space) -->
<text class="ts" x="428" y="302" text-anchor="middle" fill="rgb(210,145,40)">impl. gap</text>
<text class="ts" x="471" y="325" text-anchor="start" fill="rgb(210,145,40)">design gap</text>

<!-- Agent circles — drawn over edges to naturally clip line endpoints -->

<!-- Team Lead (entry point) -->
<circle cx="340" cy="90" r="48" fill="rgb(8,80,65)" stroke="rgb(93,202,165)" stroke-width="1.5"/>
<text class="th" x="340" y="83" text-anchor="middle" dominant-baseline="central" fill="rgb(159,225,203)">Team Lead</text>
<text class="ts" x="340" y="101" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)">discovery</text>

<!-- Architect -->
<circle cx="197" cy="194" r="48" fill="rgb(8,80,65)" stroke="rgb(93,202,165)" stroke-width="1.5"/>
<text class="th" x="197" y="187" text-anchor="middle" dominant-baseline="central" fill="rgb(159,225,203)">Architect</text>
<text class="ts" x="197" y="205" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)">tech design</text>

<!-- Engineer -->
<circle cx="252" cy="361" r="48" fill="rgb(113,43,19)" stroke="rgb(240,153,123)" stroke-width="1.5"/>
<text class="th" x="252" y="354" text-anchor="middle" dominant-baseline="central" fill="rgb(245,196,179)">Engineer</text>
<text class="ts" x="252" y="372" text-anchor="middle" dominant-baseline="central" fill="rgb(240,153,123)">implements</text>

<!-- Critic (quality gate — the routing decision node) -->
<circle cx="428" cy="361" r="48" fill="rgb(90,60,5)" stroke="rgb(210,145,40)" stroke-width="1.5"/>
<text class="th" x="428" y="354" text-anchor="middle" dominant-baseline="central" fill="rgb(245,215,150)">Critic</text>
<text class="ts" x="428" y="372" text-anchor="middle" dominant-baseline="central" fill="rgb(210,145,40)">quality gate</text>

<!-- Comms (terminal node) -->
<circle cx="483" cy="194" r="48" fill="rgb(8,80,65)" stroke="rgb(93,202,165)" stroke-width="1.5"/>
<text class="th" x="483" y="187" text-anchor="middle" dominant-baseline="central" fill="rgb(159,225,203)">Comms</text>
<text class="ts" x="483" y="205" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)">stakeholder</text>

<!-- Legend -->
<line x1="60" y1="438" x2="88" y2="438" stroke="rgb(93,202,165)" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="96" y="442" text-anchor="start" fill="rgb(194,192,182)">forward route</text>
<line x1="230" y1="438" x2="258" y2="438" stroke="rgb(210,145,40)" stroke-width="1.5" stroke-dasharray="5 3" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="266" y="442" text-anchor="start" fill="rgb(194,192,182)">Critic back-route (FAIL)</text>
<text class="ts" x="490" y="442" text-anchor="start" fill="rgb(120,118,110)">edges defined in COHORT.md</text>
</svg>
