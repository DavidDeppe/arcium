<svg width="100%" viewBox="0 0 680 450" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Arcium vault structure</title>
<desc>The arcium-vault directory contains nine numbered folders. 00-index holds registry and run logs. 01-firm-context holds read-only org knowledge synced from upstream. 02-marketplace holds CAST artifacts. 03-cohort-work through 07-sync-outbox are operational folders. 05-sessions, 06-scratch, and 99-archive are never synced.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text { font-family: -apple-system, "system-ui", "Segoe UI", sans-serif; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; font-weight: 400; fill: rgb(194,192,182); }
</style>

<rect x="40" y="36" width="600" height="378" rx="20" fill="rgb(44,44,42)" stroke="rgb(100,98,90)" stroke-width="0.5"/>
<text class="th" x="340" y="62" text-anchor="middle" fill="rgb(250,249,245)">arcium-vault/</text>

<rect x="60" y="80" width="160" height="60" rx="6" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="0.5"/>
<text class="th" x="140" y="103" text-anchor="middle" dominant-baseline="central" fill="rgb(206,203,246)">00-index</text>
<text class="ts" x="140" y="122" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)">registry + logs</text>

<rect x="240" y="80" width="160" height="60" rx="6" fill="rgb(12,50,100)" stroke="rgb(70,130,200)" stroke-width="0.5"/>
<text class="th" x="320" y="100" text-anchor="middle" dominant-baseline="central" fill="rgb(170,200,240)">01-firm-context</text>
<text class="ts" x="320" y="119" text-anchor="middle" dominant-baseline="central" fill="rgb(70,130,200)">read-only sync</text>

<rect x="420" y="80" width="200" height="60" rx="6" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="0.5"/>
<text class="th" x="520" y="100" text-anchor="middle" dominant-baseline="central" fill="rgb(206,203,246)">02-marketplace</text>
<text class="ts" x="520" y="119" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)">C · A · S · T registry</text>

<rect x="60" y="160" width="160" height="60" rx="6" fill="rgb(8,80,65)" stroke="rgb(93,202,165)" stroke-width="0.5"/>
<text class="th" x="140" y="180" text-anchor="middle" dominant-baseline="central" fill="rgb(159,225,203)">03-cohort-work</text>
<text class="ts" x="140" y="199" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)">cohort outputs</text>

<rect x="240" y="160" width="160" height="60" rx="6" fill="rgb(8,80,65)" stroke="rgb(93,202,165)" stroke-width="0.5"/>
<text class="th" x="320" y="180" text-anchor="middle" dominant-baseline="central" fill="rgb(159,225,203)">04-findings</text>
<text class="ts" x="320" y="199" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)">discoveries</text>

<rect x="420" y="160" width="200" height="60" rx="6" fill="rgb(55,54,52)" stroke="rgb(120,118,110)" stroke-width="0.5"/>
<text class="th" x="520" y="180" text-anchor="middle" dominant-baseline="central" fill="rgb(180,178,168)">05-sessions</text>
<text class="ts" x="520" y="199" text-anchor="middle" dominant-baseline="central" fill="rgb(120,118,110)">NEVER sync</text>

<rect x="60" y="240" width="160" height="60" rx="6" fill="rgb(55,54,52)" stroke="rgb(120,118,110)" stroke-width="0.5"/>
<text class="th" x="140" y="260" text-anchor="middle" dominant-baseline="central" fill="rgb(180,178,168)">06-scratch</text>
<text class="ts" x="140" y="279" text-anchor="middle" dominant-baseline="central" fill="rgb(120,118,110)">NEVER sync</text>

<rect x="240" y="240" width="160" height="60" rx="6" fill="rgb(8,80,65)" stroke="rgb(93,202,165)" stroke-width="0.5"/>
<text class="th" x="320" y="260" text-anchor="middle" dominant-baseline="central" fill="rgb(159,225,203)">07-sync-outbox</text>
<text class="ts" x="320" y="279" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)">stage upstream</text>

<rect x="420" y="240" width="200" height="60" rx="6" fill="rgb(55,54,52)" stroke="rgb(120,118,110)" stroke-width="0.5"/>
<text class="th" x="520" y="260" text-anchor="middle" dominant-baseline="central" fill="rgb(180,178,168)">99-archive</text>
<text class="ts" x="520" y="279" text-anchor="middle" dominant-baseline="central" fill="rgb(120,118,110)">NEVER sync</text>

<rect x="60" y="324" width="240" height="36" rx="6" fill="rgb(44,44,42)" stroke="rgb(100,98,90)" stroke-width="0.5"/>
<text class="th" x="180" y="342" text-anchor="middle" dominant-baseline="central" fill="rgb(194,192,182)">.vault-config.yaml</text>

<text class="ts" x="310" y="342" text-anchor="start" fill="rgb(120,118,110)">vault identity + sync config</text>

<text class="ts" x="60" y="396" text-anchor="start" fill="rgb(93,202,165)">● teal = operational</text>
<text class="ts" x="180" y="396" text-anchor="start" fill="rgb(175,169,236)">● purple = system</text>
<text class="ts" x="300" y="396" text-anchor="start" fill="rgb(70,130,200)">● blue = synced</text>
<text class="ts" x="400" y="396" text-anchor="start" fill="rgb(120,118,110)">● gray = never sync</text>
</svg>
