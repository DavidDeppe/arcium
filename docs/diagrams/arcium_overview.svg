<svg width="100%" viewBox="0 0 680 492" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Arcium system overview</title>
<desc>User sends a cohort id and idea to the CohortCoordinator, which uses CAST manifests to coordinate five specialist agents, producing vault deliverables and generated code for the user.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text { font-family: -apple-system, "system-ui", "Segoe UI", sans-serif; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; font-weight: 400; fill: rgb(194,192,182); }
.arr { stroke: rgb(156,154,146); stroke-width: 1.5; fill: none; }
</style>

<text class="th" x="340" y="24" text-anchor="middle" fill="rgb(250,249,245)">Arcium — enterprise agentic coordination platform</text>

<rect x="270" y="36" width="140" height="44" rx="8" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="0.5"/>
<text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central" fill="rgb(211,209,199)">User</text>

<line x1="340" y1="80" x2="340" y2="108" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="352" y="98" text-anchor="start">cohort id + idea</text>

<rect x="60" y="112" width="560" height="168" rx="16" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="0.5"/>
<text class="th" x="340" y="136" text-anchor="middle" fill="rgb(206,203,246)">CohortCoordinator</text>

<rect x="70" y="150" width="92" height="52" rx="6" fill="rgb(8,80,65)" stroke="rgb(93,202,165)" stroke-width="0.5"/>
<text class="th" x="116" y="169" text-anchor="middle" dominant-baseline="central" fill="rgb(159,225,203)">Team Lead</text>
<text class="ts" x="116" y="188" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)">Discovery</text>

<rect x="182" y="150" width="92" height="52" rx="6" fill="rgb(8,80,65)" stroke="rgb(93,202,165)" stroke-width="0.5"/>
<text class="th" x="228" y="169" text-anchor="middle" dominant-baseline="central" fill="rgb(159,225,203)">Architect</text>
<text class="ts" x="228" y="188" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)">Tech design</text>

<rect x="294" y="150" width="92" height="52" rx="6" fill="rgb(113,43,19)" stroke="rgb(240,153,123)" stroke-width="0.5"/>
<text class="th" x="340" y="169" text-anchor="middle" dominant-baseline="central" fill="rgb(245,196,179)">Engineer</text>
<text class="ts" x="340" y="188" text-anchor="middle" dominant-baseline="central" fill="rgb(240,153,123)">Implements</text>

<rect x="406" y="150" width="92" height="52" rx="6" fill="rgb(90,60,5)" stroke="rgb(210,145,40)" stroke-width="0.5"/>
<text class="th" x="452" y="169" text-anchor="middle" dominant-baseline="central" fill="rgb(245,215,150)">Critic</text>
<text class="ts" x="452" y="188" text-anchor="middle" dominant-baseline="central" fill="rgb(210,145,40)">Quality gate</text>

<rect x="518" y="150" width="92" height="52" rx="6" fill="rgb(8,80,65)" stroke="rgb(93,202,165)" stroke-width="0.5"/>
<text class="th" x="564" y="169" text-anchor="middle" dominant-baseline="central" fill="rgb(159,225,203)">Comms</text>
<text class="ts" x="564" y="188" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)">Stakeholder</text>

<text class="ts" x="340" y="256" text-anchor="middle">CAST manifest resolver — cohort · agent · skill · tool composition</text>

<line x1="340" y1="280" x2="340" y2="302" stroke="rgb(156,154,146)" stroke-width="1.5" fill="none"/>
<line x1="175" y1="302" x2="505" y2="302" stroke="rgb(156,154,146)" stroke-width="1.5" fill="none"/>
<line x1="175" y1="302" x2="175" y2="322" class="arr" marker-end="url(#arrow)"/>
<line x1="505" y1="302" x2="505" y2="322" class="arr" marker-end="url(#arrow)"/>

<rect x="75" y="322" width="200" height="52" rx="8" fill="rgb(12,50,100)" stroke="rgb(70,130,200)" stroke-width="0.5"/>
<text class="th" x="175" y="341" text-anchor="middle" dominant-baseline="central" fill="rgb(170,200,240)">arcium-vault</text>
<text class="ts" x="175" y="360" text-anchor="middle" dominant-baseline="central" fill="rgb(70,130,200)">03-cohort-work/</text>

<rect x="405" y="322" width="200" height="52" rx="8" fill="rgb(39,80,10)" stroke="rgb(151,196,89)" stroke-width="0.5"/>
<text class="th" x="505" y="341" text-anchor="middle" dominant-baseline="central" fill="rgb(192,221,151)">~/projects/</text>
<text class="ts" x="505" y="360" text-anchor="middle" dominant-baseline="central" fill="rgb(151,196,89)">Generated code + tests</text>

<line x1="175" y1="374" x2="175" y2="410" stroke="rgb(156,154,146)" stroke-width="1.5" fill="none"/>
<line x1="505" y1="374" x2="505" y2="410" stroke="rgb(156,154,146)" stroke-width="1.5" fill="none"/>
<line x1="175" y1="410" x2="340" y2="410" stroke="rgb(156,154,146)" stroke-width="1.5" fill="none"/>
<line x1="505" y1="410" x2="340" y2="410" stroke="rgb(156,154,146)" stroke-width="1.5" fill="none"/>
<line x1="340" y1="410" x2="340" y2="426" class="arr" marker-end="url(#arrow)"/>

<rect x="240" y="426" width="200" height="44" rx="8" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="0.5"/>
<text class="th" x="340" y="448" text-anchor="middle" dominant-baseline="central" fill="rgb(211,209,199)">Deliverables to user</text>
</svg>
